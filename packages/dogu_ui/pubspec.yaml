name: dogu_ui
description: Dogu 디자인 시스템 — 디자인 토큰과 범용 컴포넌트. 앱 데이터(스토어·모델·라우팅)를 모른다.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    # 브랜드 로고(항아리 엠블럼) — 정본은 design/assets/logo-square.png, 파생본은 scripts/sync_logo.sh가 만든다.
    - assets/logo-square.png
