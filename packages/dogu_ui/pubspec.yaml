name: dogu_ui
description: Dogu 디자인 시스템 — 디자인 토큰과 범용 컴포넌트. 앱 데이터(스토어·모델·라우팅)를 모른다.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    # 브랜드 로고(항아리 엠블럼) — 정본은 design/assets/logo-square.png, 파생본은 scripts/sync_logo.sh가 만든다.
    - assets/logo-square.png
    # 폰트를 fonts:가 아닌 assets:로 등록 — 엔진 FontManifest 프리로드(웹 첫 페인트 차단/이중 로드)를 피하고
    # 앱이 런타임 FontLoader로만 등록한다(lib/src/tokens/typography.dart의 에셋 키).
    # Dogu Sans = Pretendard 서브셋(굵기당 1.5MB → 350KB), 개명 사유는 assets/fonts/dogusans/NOTICE.md
    - assets/fonts/dogusans/DoguSans-Regular.otf
    - assets/fonts/dogusans/DoguSans-SemiBold.otf
    - assets/fonts/dogusans/DoguSans-Bold.otf
    - assets/fonts/dogusans/DoguSans-ExtraBold.otf
    # Dogu Hand = HSBombaram 3.0 서브셋 — 브랜드 타이틀 전용(416KB → 14KB)
    - assets/fonts/doguhand/DoguHand-Thin.otf
    # Gaegu Bold 서브셋 — 주문 결과 화면의 농담 한 줄 전용
    - assets/fonts/gaegu/Gaegu-Bold-subset.ttf
    # Dogu Serif = Playfair Display Bold 서브셋 — 가격·숫자(294KB → 49KB), 개명·₩ 합성은 assets/fonts/doguserif/NOTICE.md
    - assets/fonts/doguserif/DoguSerif-Bold.ttf
