name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest>=8,<9"

      - name: Run API tests against committed fixture DB
        env:
          # CI has no crawled dogu.db (26MB, git-ignored); tests run against the
          # small deterministic fixture committed at app/data/test_fixture.db.
          DOGU_DB_PATH: ${{ github.workspace }}/backend/app/data/test_fixture.db
        run: pytest

  frontend:
    name: Frontend (analyze, widget tests, web build + load budget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (UI / code errors)
        run: flutter analyze

      - name: Widget tests (UI behavior)
        # Golden snapshot tests are platform-sensitive (font/AA differences between
        # the dev machine and CI); they are committed as image deliverables and
        # regenerated locally, so exclude them from the cross-platform CI run.
        run: flutter test --exclude-tags golden

      - name: Build web (release, production API base)
        # 배포와 같은 경로로 빌드한다 — 스크립트가 API_BASE_URL(app/.env.production) 주입을
        # 강제하고, 번들에 실제로 박혔는지 grep으로 확인한다. 그냥 `flutter build web`으로
        # 빌드해 배포하면 배포본이 사용자의 localhost를 호출한다(실제 사고).
        run: ./scripts/build_prod.sh

      - name: Loading-performance budget (gzipped main.dart.js)
        run: |
          BUDGET_KB=1200
          RAW=$(stat -c%s build/web/main.dart.js)
          GZ=$(gzip -c build/web/main.dart.js | wc -c)
          GZ_KB=$((GZ / 1024))
          echo "main.dart.js: $((RAW / 1024)) KB raw, ${GZ_KB} KB gzipped (budget ${BUDGET_KB} KB)"
          if [ "$GZ_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::main.dart.js gzipped ${GZ_KB} KB exceeds loading budget ${BUDGET_KB} KB"
            exit 1
          fi

  goldens:
    name: Golden snapshots (UI regressions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Brand logo mirror is in sync
        working-directory: .
        run: ./scripts/sync_logo.sh --check

      - name: Golden snapshot tests
        # 골든 PNG는 이 잡(ubuntu-latest)에서 생성한 것이 정본이다. 로컬(macOS)에서
        # --update-goldens로 만든 이미지는 폰트/AA가 달라 여기서 깨진다.
        # 화면을 고쳤으면 Update goldens 워크플로를 돌려 산출물을 받아 커밋할 것.
        run: flutter test --tags golden

      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/failures/**
          if-no-files-found: ignore
          retention-days: 7

  backend-integration:
    name: Frontend ↔ backend contract (live API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "uvicorn[standard]>=0.30,<1.0"

      - name: Start the API
        working-directory: backend
        env:
          # CI에는 크롤링된 dogu.db가 없다 — 커밋된 결정적 픽스처로 띄운다.
          DOGU_DB_PATH: ${{ github.workspace }}/backend/app/data/test_fixture.db
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/health; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy in 30s"; cat /tmp/api.log; exit 1

      - name: Install frontend dependencies
        working-directory: app
        run: flutter pub get

      - name: Contract tests (DoguRepository against the live API)
        working-directory: app
        run: |
          flutter test test/backend_contract_test.dart \
            --dart-define=BACKEND_INTEGRATION=true \
            --dart-define=API_BASE_URL=http://127.0.0.1:8000

      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log
