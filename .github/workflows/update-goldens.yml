name: Update goldens

# 골든 PNG의 정본 생성기. CI(ubuntu-latest)와 같은 렌더러로 만들어야 골든 잡이 통과한다.
# 로컬 macOS에서 --update-goldens로 만든 이미지는 폰트/안티에일리어싱이 달라 CI에서 깨진다.
#
# 쓰는 법: Actions → Update goldens → Run workflow(브랜치 선택) → 끝나면 goldens 아티팩트를
# 내려받아 app/test/features/에 풀어 덮어쓰고 커밋한다(아티팩트 안은 <기능>/goldens/*.png).
# 디자인 시스템 컴포넌트 골든은 catalog-goldens 아티팩트 → packages/dogu_ui/widgetbook/test/goldens/에 푼다.
on:
  workflow_dispatch:

jobs:
  update:
    name: Regenerate golden PNGs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate goldens
        run: flutter test --update-goldens --tags golden

      - name: Upload goldens
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: app/test/features/*/goldens/*.png
          retention-days: 7

      - name: Regenerate component goldens (design catalog)
        working-directory: packages/dogu_ui/widgetbook
        run: |
          flutter pub get
          flutter test --update-goldens --tags golden

      - name: Upload component goldens
        uses: actions/upload-artifact@v4
        with:
          name: catalog-goldens
          path: packages/dogu_ui/widgetbook/test/goldens/**
          retention-days: 7
