<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="새로 들어온 상품부터 오늘의 특가까지. 마음에 드는 것만 빠르게 골라 담는 쇼핑 리스트.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="욕망의 장바구니">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>욕망의 장바구니</title>
  <link rel="manifest" href="manifest.json">
  <!-- 첫 페인트 전에 등록하는 폰트(lib/main.dart의 doguEssentialFontAssets + 타이틀 서체)를 엔진·main.dart.js와
       나란히 처음부터 받는다. Flutter는 폰트를 fetch()로 읽으므로 as="fetch" + crossorigin이어야 같은 요청으로
       재사용된다(as="font"면 같은 파일을 두 번 받는다). 목록은 test/font_preload_test.dart가 코드와 맞춰 둔다. -->
  <link rel="preload" href="assets/packages/dogu_ui/assets/fonts/dogusans/DoguSans-Regular.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/packages/dogu_ui/assets/fonts/dogusans/DoguSans-SemiBold.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/packages/dogu_ui/assets/fonts/dogusans/DoguSans-Bold.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/packages/dogu_ui/assets/fonts/dogusans/DoguSans-ExtraBold.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/packages/dogu_ui/assets/fonts/doguhand/DoguHand-Thin.otf" as="fetch" crossorigin>

  <!-- 로딩 화면 — Flutter가 첫 화면을 그리기 전(4G에서 수 초)의 빈 흰 화면 대신 바로 보인다.
       첫 프레임(flutter-first-frame)에 사라진다. 점은 앱의 LoadingDots와 같은 모양·속도·밝기.
       로고는 헤더처럼 원형으로 잘라 정본의 사각 바탕이 안 보이게 한다. -->
  <style>
    html, body { margin: 0; background: #ffffff; }
    #splash {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: #ffffff; pointer-events: none; transition: opacity .18s ease-out;
    }
    #splash.done { opacity: 0; }
    #splash img { width: 72px; height: 72px; border-radius: 50%; }
    #splash .dots { display: flex; gap: 6px; }
    #splash .dots span {
      width: 6px; height: 6px; border-radius: 50%; background: #6b6b6b; opacity: .25;
      animation: splash-dot 1s linear infinite;
    }
    #splash .dots span:nth-child(2) { animation-delay: .2s; }
    #splash .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes splash-dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash .dots span { animation: none; opacity: .6; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="불러오는 중">
    <!-- fetchpriority=high: 폰트 미리받기(약 1MB)와 대역폭을 나누면 4G에서 로고가 3초 넘게 늦었다. -->
    <img src="assets/packages/dogu_ui/assets/logo-square.png" alt="" width="72" height="72" fetchpriority="high">
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 200);
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
