tags:
  integration:
    description: >-
      Frontend/backend contract tests that need a live backend. Skipped unless
      run with --dart-define=BACKEND_INTEGRATION=true (CI's backend-integration
      job starts uvicorn against the committed fixture DB first).
  golden:
    description: >-
      Golden image snapshot tests. The canonical PNGs are rendered on CI
      (ubuntu) — each feature module's CI job runs its goldens. Local macOS
      renders differ (fonts/anti-aliasing), so scripts/test_modules.sh skips
      them by default; regenerate via the "Update goldens" workflow.
