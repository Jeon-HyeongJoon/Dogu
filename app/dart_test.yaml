tags:
  integration:
    description: >-
      Frontend/backend contract tests that need a live backend. Skipped unless
      run with --dart-define=BACKEND_INTEGRATION=true (CI's backend-integration
      job starts uvicorn against the committed fixture DB first).
  golden:
    description: >-
      Golden image snapshot tests. Platform-sensitive (font/anti-aliasing
      differences), so committed as image deliverables and regenerated locally
      with `flutter test --update-goldens --tags golden`; excluded from CI.
