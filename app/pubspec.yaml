name: dogu_mobile_shop
description: Flutter source port of the 욕망의장바구니 five-tab mobile shopping app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^14.6.2
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed.json
    # 브랜드 로고(항아리 엠블럼) — 상단 헤더 메인 로고.
    # 정본은 design/assets/logo-square.png, 파생본 동기화는 scripts/sync_logo.sh
    - assets/logo-square.png
    # 폰트를 fonts:가 아닌 assets:로 등록 — 엔진 FontManifest 프리로드(웹 첫 페인트 차단/이중 로드)를 피하고
    # 런타임 FontLoader로만 등록한다. (bootstrap이 첫 프레임 이후 비차단 로드)
    # Dogu Sans = Pretendard 서브셋(굵기당 1.5MB → 350KB). 개명 사유와 재생성은
    # assets/fonts/dogusans/NOTICE.md 와 scripts/build_fonts.sh 참조.
    - assets/fonts/dogusans/DoguSans-Regular.otf
    - assets/fonts/dogusans/DoguSans-SemiBold.otf
    - assets/fonts/dogusans/DoguSans-Bold.otf
    - assets/fonts/dogusans/DoguSans-ExtraBold.otf
    # HSBombaram(봄바람) 손글씨체 — 상단 브랜드 타이틀 전용(Thin). assets: + 런타임 FontLoader.
    - assets/fonts/hsbombaram/HSBombaram-Thin.otf
    # Gaegu Bold 서브셋 — 주문 결과 화면의 농담 한 줄 전용(디자인 시안과 같은 자형).
    # 원본은 한글 2350자 2.9MB라 charset.txt의 글자만 남겼다(scripts/build_joke_font.sh).
    - assets/fonts/gaegu/Gaegu-Bold-subset.ttf
