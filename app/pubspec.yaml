name: dogu_mobile_shop
description: Flutter source port of the 욕망의장바구니 five-tab mobile shopping app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^14.6.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  # 디자인 시스템(토큰 + 범용 컴포넌트) — 앱 데이터를 모르는 별도 패키지. 경계는 컴파일러가 지킨다.
  dogu_ui:
    path: ../packages/dogu_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed.json
    # 폰트·브랜드 로고는 디자인 시스템(packages/dogu_ui)이 담는다 — 여기 다시 등록하면 두 벌이 실린다.
