<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8f7130; } a:hover { color: #1d4a33; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #faf5ea; display: flex; flex-direction: column; overflow: hidden;">

  <!-- 상단 세이프에어리어(Scaffold 배경 = paper) -->
  <div style="height: 44px; flex-shrink: 0;"></div>

  <!-- 상세 페이지와 같은 그린 바 -->
  <div style="height: 56px; flex-shrink: 0; background: #1d4a33; border-bottom: 2px solid #c9a24e; padding: 0 12px 0 8px; display: flex; align-items: center; gap: 4px;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;">
      <path d="M15 6l-6 6 6 6" stroke="#f5eeda" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.3px; color: #f5eeda;">배송 안내</span>
    <div style="flex-grow: 1;"></div>
    <span style="font-size: 9px; font-weight: 700; letter-spacing: 1.1px; color: #c9a24e;">1F · CHECKOUT</span>
  </div>

  <!-- 본문 -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 20px;">

    <!-- 섹션 헤더 (앱 V2SectionHeader 문법) -->
    <div style="padding-top: 32px;">
      <div style="height: 1px; background: #e2d8c2;"></div>
      <div style="margin-top: 14px; display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.1px; color: #92a097;">NO.01</span>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.1px; color: #92a097;">DELIVERY</span>
      </div>
      <div style="margin-top: 6px; font-size: 24px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.15; color: #1a2b20;">배송 준비 중</div>
    </div>

    <!-- 도착 예정 -->
    <div style="margin-top: 16px; background: #f1e9d6; border-radius: 4px; padding: 14px; display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 9px; font-weight: 700; letter-spacing: 1.1px; color: #92a097;">DD-2608-0417</span>
        <span style="font-size: 13px; color: #53645a;">도착 예정</span>
      </div>
      <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.15; color: #1d4a33;">8월 30일 (토)</span>
    </div>

    <!-- 배송 단계 -->
    <div style="margin-top: 22px; position: relative;">
      <div style="position: absolute; left: 5px; top: 10px; bottom: 10px; width: 2px; background: #e2d8c2;"></div>

      <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #1d4a33; position: relative; flex-shrink: 0;"></div>
        <span style="font-size: 13px; font-weight: 700; color: #53645a; flex-grow: 1;">결제 완료</span>
        <span style="font-size: 11px; color: #92a097;">8.28 21:04</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #b3282d; position: relative; flex-shrink: 0;"></div>
        <span style="font-size: 13px; font-weight: 800; color: #1a2b20; flex-grow: 1;">상품 준비 중</span>
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.1px; color: #b3282d;">NOW</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #faf5ea; border: 2px solid #e2d8c2; box-sizing: border-box; position: relative; flex-shrink: 0;"></div>
        <span style="font-size: 13px; font-weight: 700; color: #92a097; flex-grow: 1;">배송 중</span>
        <span style="font-size: 11px; color: #92a097;">8.29 예정</span>
      </div>

      <div style="display: flex; align-items: center; gap: 14px;">
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #faf5ea; border: 2px solid #e2d8c2; box-sizing: border-box; position: relative; flex-shrink: 0;"></div>
        <span style="font-size: 13px; font-weight: 700; color: #92a097; flex-grow: 1;">배송 완료</span>
        <span style="font-size: 11px; color: #92a097;">8.30 예정</span>
      </div>
    </div>

    <!-- 주문 상품 (앱 장바구니 행 문법) -->
    <div style="margin-top: 24px; display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.1px; color: #92a097;">SHIPMENT · 2건</span>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.1px; color: #8f7130;">묶음 배송</span>
    </div>

    <div style="margin-top: 10px; background: #f1e9d6; border-radius: 4px; padding: 10px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 2px; background: linear-gradient(135deg, #9facc6, #7e8c9c); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <span style="font-size: 25px; font-weight: 800; color: rgba(255,255,255,0.9);">N</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
        <span style="font-size: 11px; font-weight: 700; color: #92a097;">NovaTech</span>
        <span style="font-size: 14px; font-weight: 800; letter-spacing: -0.3px; color: #1a2b20; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">폴더블 무선 충전 거치대 3 in 1</span>
        <span style="font-size: 13px; font-weight: 800; color: #1a2b20;">24,900원 <span style="font-weight: 400; color: #53645a;">· 1개</span></span>
      </div>
    </div>

    <div style="margin-top: 10px; background: #f1e9d6; border-radius: 4px; padding: 10px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 2px; background: linear-gradient(135deg, #b8997a, #907e64); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <span style="font-size: 25px; font-weight: 800; color: rgba(255,255,255,0.9);">D</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
        <span style="font-size: 11px; font-weight: 700; color: #92a097;">Daily.fits</span>
        <span style="font-size: 14px; font-weight: 800; letter-spacing: -0.3px; color: #1a2b20; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">오버사이즈 코튼 후드 집업</span>
        <span style="font-size: 13px; font-weight: 800; color: #1a2b20;">44,000원 <span style="font-weight: 400; color: #53645a;">· 2개</span></span>
      </div>
    </div>

    <!-- 결제 금액 -->
    <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2d8c2; display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 15px; font-weight: 800; letter-spacing: -0.3px; color: #1a2b20;">결제 금액 (2)</span>
      <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.3px; color: #b3282d;">68,900원</span>
    </div>

    <div style="flex-grow: 1;"></div>

    <!-- 확인 -->
    <div style="padding-bottom: 24px; display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 54px; border-radius: 4px; background: #1d4a33; border: 1.2px solid #c9a24e; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
        <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.3px; color: #f5eeda;">확인</span>
      </div>
      <span style="font-size: 11px; color: #92a097; text-align: center;">확인을 누르면 이번 주문의 결과를 알려드립니다.</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
